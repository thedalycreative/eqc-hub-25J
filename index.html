<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intake 26B | Equinim College</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script>tailwind.config={theme:{extend:{colors:{brand:{dark:'#0f172a',deeper:'#020617',mid:'#1e293b',accent:'#10b981',accent2:'#06b6d4',warn:'#f59e0b',purple:'#8b5cf6'}},fontFamily:{sans:['Inter','system-ui','sans-serif'],mono:['JetBrains Mono','monospace']}}}}</script>
    <style>
        body{font-family:'Inter',system-ui,sans-serif;margin:0;}
        .mono{font-family:'JetBrains Mono',monospace;}
        .grad-text{background:linear-gradient(135deg,#10b981,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
        .card{background:#0f172a;border-radius:16px;border:1px solid rgba(255,255,255,0.06);padding:clamp(16px,2vw,32px);display:flex;flex-direction:column;overflow:hidden;}
        .blink{animation:bk 1s step-end infinite;}@keyframes bk{0%,100%{opacity:1}50%{opacity:0}}
        .pulse-dot{animation:pd 2s ease-in-out infinite;}@keyframes pd{0%,100%{opacity:.3}50%{opacity:1}}
        .fade-in{animation:fi .5s ease-out;}@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    </style>
</head>
<body class="bg-brand-deeper text-white h-screen overflow-hidden flex flex-col">

<!-- ╔══════════════════════════════════════════════════════╗ -->
<!-- ║  CONFIG — Change these for each intake              ║ -->
<!-- ╚══════════════════════════════════════════════════════╝ -->
<script>
const CONFIG = {
    intake:       '26B',
    course:       'Diploma of IT — Back End Web Development',
    college:      'Equinim College',
    room:         'Room 1',
    trainer:      'Tim',
    trainerImg:   'img/tim-head.png',
    startDate:    '2026-07-06',   // first day of class
    endDate:      '2026-12-18',   // last day of class
    classDays:    [1, 2, 5],      // Mon=1, Tue=2, Fri=5
    holidays:     [
        // { start: '2026-09-28', end: '2026-10-09' }  // term break example
    ],
    // Google Sheet: File > Share > Publish to web > CSV
    // Columns: Date | Trainer | Topics | Notes | Attendance
    sheetUrl:     '',
    refreshSecs:  60,
};
</script>

<!-- NAVBAR -->
<nav class="flex items-center justify-between px-6 border-b border-white/5 shrink-0 bg-brand-dark/60" style="height:80px;">
    <div class="flex items-center gap-5">
        <span class="text-5xl font-black grad-text tracking-tight leading-none" id="nav-intake">26B</span>
        <div class="h-12 w-px bg-white/10"></div>
        <span class="text-2xl font-bold text-white/70" id="nav-college">Equinim College</span>
        <span class="text-white/15 text-2xl">·</span>
        <span class="text-xl text-white/40 flex items-center gap-2"><i class="bi bi-mortarboard-fill"></i> <span id="nav-course-short">Diploma of IT</span></span>
    </div>
    <div class="flex items-center gap-5">
        <div class="flex items-center gap-2 text-xl text-white/40"><i class="bi bi-door-open-fill"></i><span class="font-semibold" id="nav-room">Room 1</span></div>
        <div class="h-12 w-px bg-white/10"></div>
        <div id="class-badge"></div>
        <div class="h-12 w-px bg-white/10"></div>
        <div class="flex items-center gap-2 text-xl mono text-white/50" id="header-clock"></div>
        <div class="h-12 w-px bg-white/10"></div>
        <div class="flex items-center gap-3" id="nav-trainer"></div>
    </div>
</nav>

<!-- 6-TILE GRID -->
<main class="grid gap-3 p-3 flex-1 min-h-0" style="grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr;">

    <!-- TILE 1: INTAKE + COURSE (big hero) -->
    <div class="card items-center justify-center text-center" style="border-color:rgba(16,185,129,0.15);">
        <div class="text-[10rem] font-black grad-text leading-none tracking-tighter" id="tile-intake">26B</div>
        <div class="text-2xl font-bold text-white/40 mt-2" id="tile-course">Diploma of IT — Back End Web Development</div>
    </div>

    <!-- TILE 2: TRAINER + DATE -->
    <div class="card items-center justify-center text-center" style="border-color:rgba(6,182,212,0.1);">
        <img id="tile-trainer-img" src="img/tim-head.png" alt="" class="w-28 h-28 rounded-full object-cover border-4 border-brand-accent/40 mb-4">
        <div class="text-5xl font-black text-white/90" id="tile-trainer-name">Tim</div>
        <div class="text-xl text-brand-accent font-bold uppercase tracking-widest mt-1">Trainer</div>
        <div class="text-lg text-white/30 mt-3 mono" id="tile-date"></div>
    </div>

    <!-- TILE 3: TODAY'S TOPICS -->
    <div class="card" style="border-color:rgba(139,92,246,0.12);">
        <h2 class="text-2xl font-extrabold text-white/90 flex items-center gap-3 mb-4 shrink-0">
            <i class="bi bi-journal-text text-purple-400"></i> Today's Topics
        </h2>
        <div class="flex-1 flex flex-col justify-center" id="tile-topics">
            <div class="text-center text-white/20 text-xl">
                <i class="bi bi-cloud-arrow-down text-4xl block mb-2"></i>
                Submit via Google Form to populate
            </div>
        </div>
    </div>

    <!-- TILE 4: ATTENDANCE -->
    <div class="card" style="border-color:rgba(16,185,129,0.1);">
        <h2 class="text-2xl font-extrabold text-white/90 flex items-center gap-3 mb-4 shrink-0">
            <i class="bi bi-people-fill text-brand-accent"></i> Attendance
        </h2>
        <div class="flex-1 flex flex-col justify-center items-center" id="tile-attendance">
            <div class="text-[6rem] font-black text-brand-accent leading-none" id="att-count">—</div>
            <div class="text-2xl text-white/30 font-bold mt-2">present today</div>
        </div>
    </div>

    <!-- TILE 5: NOTES / ANNOUNCEMENTS -->
    <div class="card" style="border-color:rgba(245,158,11,0.1);">
        <h2 class="text-2xl font-extrabold text-white/90 flex items-center gap-3 mb-4 shrink-0">
            <i class="bi bi-megaphone-fill text-amber-400"></i> Announcements
        </h2>
        <div class="flex-1 flex flex-col justify-center" id="tile-notes">
            <div class="text-center text-white/20 text-xl">
                <i class="bi bi-chat-dots text-4xl block mb-2"></i>
                No announcements yet
            </div>
        </div>
    </div>

    <!-- TILE 6: COURSE PROGRESS -->
    <div class="card" style="border-color:rgba(236,72,153,0.1);">
        <h2 class="text-2xl font-extrabold text-white/90 flex items-center gap-3 mb-4 shrink-0">
            <i class="bi bi-bar-chart-fill text-pink-400"></i> Course Progress
        </h2>
        <div class="flex-1 flex flex-col justify-center items-center" id="tile-progress">
            <div class="w-full max-w-xs">
                <div class="flex justify-between text-lg text-white/40 mb-2">
                    <span id="prog-label">Day 0</span>
                    <span id="prog-pct">0%</span>
                </div>
                <div class="w-full h-6 bg-white/5 rounded-full overflow-hidden">
                    <div id="prog-bar" class="h-full rounded-full bg-gradient-to-r from-pink-500 to-purple-500 transition-all duration-1000" style="width:0%"></div>
                </div>
                <div class="flex justify-between text-base text-white/20 mt-2">
                    <span id="prog-start">Start</span>
                    <span id="prog-end">End</span>
                </div>
            </div>
            <div class="flex gap-6 mt-6 text-lg">
                <div class="text-center"><div class="text-3xl font-black text-white/60" id="prog-classes">—</div><div class="text-sm text-white/25">Classes</div></div>
                <div class="text-center"><div class="text-3xl font-black text-white/60" id="prog-remaining">—</div><div class="text-sm text-white/25">Remaining</div></div>
                <div class="text-center"><div class="text-3xl font-black text-white/60" id="prog-weeks">—</div><div class="text-sm text-white/25">Weeks Left</div></div>
            </div>
        </div>
    </div>

</main>

<script>
// ═══════════════════════════════════════════════════════════════
// INIT NAV FROM CONFIG
// ═══════════════════════════════════════════════════════════════
document.getElementById('nav-intake').textContent = CONFIG.intake;
document.getElementById('nav-college').textContent = CONFIG.college;
document.getElementById('nav-room').textContent = CONFIG.room;
document.getElementById('tile-intake').textContent = CONFIG.intake;
document.getElementById('tile-course').textContent = CONFIG.course;
document.getElementById('tile-trainer-name').textContent = CONFIG.trainer;
document.getElementById('tile-trainer-img').src = CONFIG.trainerImg;
document.title = `Intake ${CONFIG.intake} | ${CONFIG.college}`;

// Trainer in navbar
document.getElementById('nav-trainer').innerHTML = `
    <img src="${CONFIG.trainerImg}" alt="${CONFIG.trainer}" class="w-14 h-14 rounded-full object-cover border-[3px] border-brand-accent/50">
    <div class="leading-tight">
        <div class="text-lg font-bold text-white/90">${CONFIG.trainer}</div>
        <div class="text-xs text-brand-accent font-bold uppercase tracking-wider">Trainer</div>
    </div>`;

// ═══════════════════════════════════════════════════════════════
// CLOCK
// ═══════════════════════════════════════════════════════════════
function updateClock() {
    const n = new Date();
    const h = String(n.getHours()).padStart(2,'0');
    const m = String(n.getMinutes()).padStart(2,'0');
    const s = String(n.getSeconds()).padStart(2,'0');
    const d = n.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
    document.getElementById('header-clock').innerHTML =
        `<i class="bi bi-calendar3 text-white/25"></i><span class="text-white/40">${d}</span>` +
        `<span class="text-white/10 mx-1">|</span>` +
        `<i class="bi bi-clock text-white/25"></i><span class="text-lg font-semibold">${h}<span class="blink">:</span>${m}<span class="blink">:</span>${s}</span>`;
    document.getElementById('tile-date').textContent = d;
}
updateClock();
setInterval(updateClock, 1000);

// ═══════════════════════════════════════════════════════════════
// CLASS COUNTER
// ═══════════════════════════════════════════════════════════════
function isHoliday(d) {
    return CONFIG.holidays.some(h => {
        const s = new Date(h.start), e = new Date(h.end);
        s.setHours(0,0,0,0); e.setHours(0,0,0,0);
        return d >= s && d <= e;
    });
}
function isClassDay(d) { return CONFIG.classDays.includes(d.getDay()) && !isHoliday(d); }

function getCourseProgress() {
    const today = new Date(); today.setHours(0,0,0,0);
    const start = new Date(CONFIG.startDate); start.setHours(0,0,0,0);
    const end = new Date(CONFIG.endDate); end.setHours(0,0,0,0);

    // Count total class days and elapsed class days
    let total = 0, elapsed = 0;
    let d = new Date(start);
    while (d <= end) {
        if (isClassDay(d)) {
            total++;
            if (d <= today) elapsed++;
        }
        d.setDate(d.getDate() + 1);
    }

    // Count remaining days from today
    let remaining = 0;
    d = new Date(today); d.setDate(d.getDate() + 1);
    while (d <= end) {
        if (isClassDay(d)) remaining++;
        d.setDate(d.getDate() + 1);
    }

    const isToday = isClassDay(today) && today >= start && today <= end;
    const weeksLeft = Math.ceil(remaining / CONFIG.classDays.length);
    const pct = total > 0 ? Math.round(elapsed / total * 100) : 0;

    return { total, elapsed, remaining, isToday, weeksLeft, pct };
}

function renderClassBadge() {
    const info = getCourseProgress();
    const el = document.getElementById('class-badge');
    if (info.isToday) {
        el.innerHTML = `<div class="bg-brand-accent/15 border border-brand-accent/30 rounded-xl px-5 py-1.5 text-center">
            <div class="text-[8px] text-white/40 font-bold uppercase tracking-widest">Class</div>
            <div class="text-3xl font-black text-brand-accent mono leading-tight">#${info.elapsed}</div></div>`;
    } else {
        el.innerHTML = `<div class="bg-red-500/10 border border-red-500/20 rounded-xl px-4 py-1.5 text-center">
            <div class="text-sm font-extrabold text-red-400">NO CLASS TODAY</div></div>`;
    }
}

function renderProgress() {
    const info = getCourseProgress();
    document.getElementById('prog-label').textContent = `Day ${info.elapsed} of ${info.total}`;
    document.getElementById('prog-pct').textContent = info.pct + '%';
    document.getElementById('prog-bar').style.width = info.pct + '%';
    document.getElementById('prog-start').textContent = new Date(CONFIG.startDate).toLocaleDateString('en-AU',{day:'numeric',month:'short'});
    document.getElementById('prog-end').textContent = new Date(CONFIG.endDate).toLocaleDateString('en-AU',{day:'numeric',month:'short'});
    document.getElementById('prog-classes').textContent = info.elapsed;
    document.getElementById('prog-remaining').textContent = info.remaining;
    document.getElementById('prog-weeks').textContent = info.weeksLeft;
}

// ═══════════════════════════════════════════════════════════════
// GOOGLE SHEETS LOADER
// Sheet columns: Date | Trainer | Topics | Notes | Attendance
// Date format: DD/MM/YYYY or YYYY-MM-DD
// Topics: semicolon-separated list e.g. "APIs; REST; Express routes"
// Attendance: number or comma-separated names
// ═══════════════════════════════════════════════════════════════
let lastData = null;

async function loadFromSheet() {
    if (!CONFIG.sheetUrl) return;
    try {
        const res = await fetch(CONFIG.sheetUrl);
        const text = await res.text();
        const rows = text.trim().split('\n').slice(1); // skip header
        if (!rows.length) return;

        // Parse all rows
        const entries = rows.map(row => {
            // Handle quoted CSV fields
            const cols = row.match(/(".*?"|[^,]+)/g)?.map(s => s.replace(/^"|"$/g,'').trim()) || [];
            return {
                date:       cols[0] || '',
                trainer:    cols[1] || '',
                topics:     cols[2] || '',
                notes:      cols[3] || '',
                attendance: cols[4] || '',
            };
        });

        // Find today's entry (most recent if multiple)
        const todayStr = new Date().toLocaleDateString('en-AU'); // DD/MM/YYYY
        const todayISO = new Date().toISOString().split('T')[0]; // YYYY-MM-DD
        let todayEntry = entries.reverse().find(e =>
            e.date === todayStr || e.date === todayISO ||
            e.date === new Date().toLocaleDateString('en-AU',{day:'2-digit',month:'2-digit',year:'numeric'})
        );

        // If no exact date match, use the most recent entry
        if (!todayEntry && entries.length) todayEntry = entries[0];
        if (!todayEntry) return;

        lastData = todayEntry;
        renderSheetData(todayEntry);
    } catch(e) {
        console.warn('Sheet load failed:', e);
    }
}

function renderSheetData(entry) {
    // Topics
    if (entry.topics) {
        const topics = entry.topics.split(/[;|]/).map(t => t.trim()).filter(Boolean);
        document.getElementById('tile-topics').innerHTML = topics.map((t, i) =>
            `<div class="flex items-center gap-3 py-2 fade-in" style="animation-delay:${i*100}ms">
                <span class="text-3xl">📌</span>
                <span class="text-3xl font-bold text-white/80">${t}</span>
            </div>`
        ).join('');
    }

    // Attendance
    if (entry.attendance) {
        const val = entry.attendance.trim();
        // Could be a number or comma-separated names
        if (/^\d+$/.test(val)) {
            document.getElementById('att-count').textContent = val;
        } else {
            const names = val.split(',').map(n => n.trim()).filter(Boolean);
            document.getElementById('att-count').textContent = names.length;
            // Optionally show names below
            const container = document.getElementById('tile-attendance');
            container.innerHTML = `
                <div class="text-[5rem] font-black text-brand-accent leading-none">${names.length}</div>
                <div class="text-xl text-white/30 font-bold mt-1">present today</div>
                <div class="flex flex-wrap gap-2 mt-3 justify-center max-h-24 overflow-y-auto">
                    ${names.map(n => `<span class="text-base bg-brand-accent/10 text-brand-accent/70 px-3 py-1 rounded-full font-semibold">${n}</span>`).join('')}
                </div>`;
        }
    }

    // Notes / Announcements
    if (entry.notes) {
        document.getElementById('tile-notes').innerHTML = `
            <div class="text-2xl font-semibold text-white/70 leading-relaxed">${entry.notes}</div>`;
    }

    // Trainer override (if different from config)
    if (entry.trainer && entry.trainer !== CONFIG.trainer) {
        document.getElementById('tile-trainer-name').textContent = entry.trainer;
    }
}

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
renderClassBadge();
renderProgress();
loadFromSheet();

// Auto-refresh from sheet
if (CONFIG.sheetUrl && CONFIG.refreshSecs > 0) {
    setInterval(loadFromSheet, CONFIG.refreshSecs * 1000);
}

// Midnight reset
setInterval(() => {
    const n = new Date();
    if (n.getHours() === 0 && n.getMinutes() === 0 && n.getSeconds() < 2) {
        renderClassBadge();
        renderProgress();
        loadFromSheet();
    }
}, 1000);
</script>
</body>
</html>
